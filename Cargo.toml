[package]
authors = ["pleme-io"]
description = "lava-viggy — typed PromessaController trait for the 7-beat Viggy tick (Observe → Diff → Classify → Decide → Act → Attest → Tick). Operationalizes theory/CONTINUOUS-SOLUTION-MACHINE.md — every controller in the lava-suite expresses its reconcile loop as a typed Promessa whose tick produces a typed BeatOutcome at every beat. Solid abstractions on top of lava-outcome-chain + lava-drift + lava-anomaly so the controller never composes the beat sequence by hand."
edition = "2024"
license = "MIT"
name = "lava-viggy"
readme = "README.md"
repository = "https://github.com/pleme-io/lava-viggy"
version = "0.1.6"

[lib]
name = "lava_viggy"
path = "src/lib.rs"

[lints.clippy]
pedantic = "warn"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
lava-outcome-chain = "0.1"
lava-drift = "0.1"
lava-anomaly = "0.1"
